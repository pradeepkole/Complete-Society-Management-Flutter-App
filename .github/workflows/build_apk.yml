name: Build Android Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Setup Android Gradle Wrapper and Resources
        run: |
          flutter create --org com.society --project-name temp_scaffold /tmp/temp_scaffold
          mkdir -p android/gradle/wrapper
          cp /tmp/temp_scaffold/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/
          cp /tmp/temp_scaffold/android/gradlew android/
          cp /tmp/temp_scaffold/android/gradlew.bat android/
          chmod +x android/gradlew
          cp -r /tmp/temp_scaffold/android/app/src/main/res/mipmap* android/app/src/main/res/
          echo "Gradle wrapper and Android resources successfully configured:"
          ls -la android/gradlew android/gradle/wrapper/
          ls -la android/app/src/main/res/

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APKs (Universal & ARM64)
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build_log.txt
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/app-release-universal.apk
          flutter build apk --release --split-per-abi 2>&1 | tee -a build_log.txt
          cp /tmp/app-release-universal.apk build/app/outputs/flutter-apk/app-release.apk
          echo "Generated APKs:"
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: society-gate-release-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Deliver APK to Telegram
        if: success()
        run: |
          ARM_APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          if [ -f "$ARM_APK" ]; then
            echo "Delivering optimized ARM64 APK to Telegram..."
            curl -s -F chat_id="467870752" \
                 -F document=@"$ARM_APK" \
                 -F caption="🚀 <b>सोसायटी व्यवस्थापन ॲप - नवीन अधिकृत आवृत्ती (ARM64)</b>%0A%0A✅ विंग व मजला पर्याय काढून सरळ फ्लॅट रचना%0A✅ केवळ चेअरमन नवीन सदस्य मंजुरी व निवड अधिकार%0A📲 या APK वर टॅप करून मोबाईलवर थेट इन्स्टॉल करा." \
                 -F parse_mode="HTML" \
                 https://api.telegram.org/bot9296282629:AAHzUCMfF11ovqVxSTTd3bPgB3cvJH9WcFg/sendDocument || true
          fi
