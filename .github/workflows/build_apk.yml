name: Build Android Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Setup Android Gradle Wrapper
        run: |
          flutter create --org com.society --project-name temp_scaffold /tmp/temp_scaffold
          mkdir -p android/gradle/wrapper
          cp /tmp/temp_scaffold/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/
          cp /tmp/temp_scaffold/android/gradlew android/
          cp /tmp/temp_scaffold/android/gradlew.bat android/
          chmod +x android/gradlew
          echo "Gradle wrapper files successfully configured:"
          ls -la android/gradlew android/gradle/wrapper/

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: society-gate-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
